<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ben's Adventures</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- Elemento de Vídeo para as Cutscenes -->
    <video id="cutsceneVideo" playsinline style="display: none;"></video>
    <button id="skipCutsceneBtn" style="display: none;">PULAR HISTÓRIA ▶</button>

    <!-- D-Pad / Analógico -->
    <div id="analogJoystick" class="game-controls">
      <div class="analog-arrow arrow-up">▲</div>
      <div class="analog-arrow arrow-down">▼</div>
      <div class="analog-arrow arrow-left">◀</div>
      <div class="analog-arrow arrow-right">▶</div>
      <div id="analogStick"></div>
    </div>

    <!-- Botões de Ação -->
    <div id="actionButtonsGroup" class="game-controls">
      <button id="btnDefend" class="mobile-action-btn btn-defend">DEFENDER</button>
      <button id="btnAttack" class="mobile-action-btn btn-attack">ATACAR</button>
      <button id="btnJump" class="mobile-action-btn btn-jump">PULAR</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
