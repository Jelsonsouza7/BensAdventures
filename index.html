<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="screen-orientation" content="landscape">
  <title>Ben's Adventures</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- ELEMENTO DE VÍDEO PARA A CUTSCENE -->
    <video id="cutsceneVideo" src="historia1.mp4" playsinline style="display: none;"></video>
    
    <!-- BOTÃO PARA PULAR A CUTSCENE -->
    <div id="skipCutsceneBtn" class="touch-btn skip-btn" style="display: none;">
      PULAR ➔
    </div>

    <!-- CONTROLES TOUCH MOBILE -->
    <div class="touch-controls">
      <div class="dpad">
        <div id="btnLeft" class="touch-btn">◀</div>
        <div id="btnRight" class="touch-btn">▶</div>
      </div>

      <div class="action-buttons">
        <div id="btnAttack" class="touch-btn btn-atk">ATK</div>
        <div id="btnJump" class="touch-btn">PULAR</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
