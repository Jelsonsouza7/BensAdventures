<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>As Aventuras do Ben - Fase 1: Praia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <!-- Controles para Telemóvel (Touch) -->
    <div class="touch-controls">
      <div class="d-pad">
        <button id="btnLeft" class="touch-btn">◄</button>
        <button id="btnRight" class="touch-btn">►</button>
      </div>
      <button id="btnJump" class="touch-btn jump-btn">PULAR</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
